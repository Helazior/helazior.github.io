<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- SÉCURITÉ (08/11/2026) : seuls les scripts du site s'exécutent (ni script en
         ligne, ni eval, ni script d'un autre domaine) ; le réseau ne va qu'au site, à
         Supabase (compte, synchro) et aux services des plugins. Une injection de
         texte ne pourrait donc jamais devenir du code. Ajouter un service = l'ajouter
         à connect-src. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://xaoqzjaqwhyvsquwwtgy.supabase.co wss://xaoqzjaqwhyvsquwwtgy.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org https://tile.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="application/javascript" src="boot.js"></script>
<script type="application/javascript" src="notify.js"></script>
<script type="application/javascript" src="attachments.js"></script>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
